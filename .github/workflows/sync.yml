
name: Sync TimeTree to Google Calendar

on:
  schedule:
    # UTC: Madrid 06:00 = 04:00 summer / 05:00 winter.
    - cron: '0 4,5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sin modificar Google Calendar'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: timetree-google-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 33

    steps:
      - name: Select Madrid schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=Europe/Madrid date +%H)" = "06" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install timetree-exporter
        if: steps.schedule.outputs.run == 'true'
        run: pip install timetree-exporter==1.0.0

      - name: Set up Node.js
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: npm ci

      - name: Check TypeScript
        if: steps.schedule.outputs.run == 'true'
        run: npm run typecheck

      - name: Run offline tests
        if: steps.schedule.outputs.run == 'true'
        run: npm test

      - name: Decode Google credentials
        if: steps.schedule.outputs.run == 'true'
        env:
          GOOGLE_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_KEY_BASE64" | base64 -d > /tmp/google-credentials.json
          chmod 600 /tmp/google-credentials.json

      - name: Run sync
        if: steps.schedule.outputs.run == 'true'
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CALENDAR_CODE }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-credentials.json

          # Escrituras requieren activar explícitamente SYNC_ENABLED
          SYNC_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.SYNC_ENABLED != 'true' }}
          SYNC_ENABLE_WRITE: "YES_I_APPROVE"

          # Eliminaciones desactivadas
          ALLOW_DELETIONS: "false"

        run: npm run sync

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/google-credentials.json /tmp/timetree.ics
