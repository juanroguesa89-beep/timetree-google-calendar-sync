
name: Sync TimeTree to Google Calendar

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timetree-google-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install timetree-exporter
        run: pip install timetree-exporter

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Decode Google credentials
        env:
          GOOGLE_KEY_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_KEY_BASE64" | base64 -d > /tmp/google-credentials.json
          chmod 600 /tmp/google-credentials.json

      - name: Run controlled sync test
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
          TIMETREE_CALENDAR_CODE: ${{ secrets.TIMETREE_CALENDAR_CODE }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/google-credentials.json

          # Prueba real autorizada, limitada a 5 operaciones
          SYNC_DRY_RUN: "false"
          SYNC_ENABLE_WRITE: "YES_I_APPROVE"
          SYNC_TEST_MODE: "true"

          # Nunca eliminar eventos durante la prueba
          ALLOW_DELETIONS: "false"

        run: npx tsx src/index.ts

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/google-credentials.json
